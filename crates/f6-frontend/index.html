<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <!-- Disable zooming: -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>InfraTrace</title>

  <!-- config for our rust wasm binary. go to https://trunkrs.dev/assets/#rust for more customization -->
  <link data-trunk rel="rust" data-wasm-opt="2" />
  <!-- this is the base url relative to which other urls will be constructed. trunk will insert this from the public-url option -->
  <base data-trunk-public-url />

  <link data-trunk rel="icon" href="assets/favicon.ico">


  <link data-trunk rel="copy-file" href="assets/sw.js" />
  <link data-trunk rel="copy-file" href="assets/manifest.json" />
  <link data-trunk rel="copy-file" href="assets/favicon-192x192.png" data-target-path="assets" />
  <link data-trunk rel="copy-file" href="assets/favicon-512x512.png" data-target-path="assets" />
  <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png" data-target-path="assets" />


  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0f0f0f">

  <style>
    html {
      /* Remove touch delay: */
      touch-action: manipulation;
    }

    :root {
      color-scheme: dark;
      --page-bg: #0f0f0f;
      --card-bg: rgba(24, 24, 24, 0.92);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f5;
      --muted: #a8a8a8;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.04), transparent 34%),
        linear-gradient(180deg, #121212 0%, var(--page-bg) 52%, #0b0b0b 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Allow canvas to fill entire web page: */
    html,
    body {
      overflow: hidden;
      margin: 0 !important;
      padding: 0 !important;
      height: 100%;
      width: 100%;
    }

    /* Make canvas fill entire document: */
    canvas {
      margin-right: auto;
      margin-left: auto;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .centered {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(420px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card-bg);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      color: var(--text);
      font-size: 24px;
      text-align: center;
    }

    .brand {
      width: 100%;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: left;
    }

    .loading-title {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 650;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .loading-copy {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ---------------------------------------------- */
    /* Loading animation from https://loading.io/css/ */
    .lds-dual-ring {
      display: inline-block;
      width: 28px;
      height: 28px;
    }

    .lds-dual-ring:after {
      content: " ";
      display: block;
      width: 28px;
      height: 28px;
      margin: 0px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.95);
      border-color: rgba(255, 255, 255, 0.95) transparent rgba(255, 255, 255, 0.95) transparent;
      animation: lds-dual-ring 1.2s linear infinite;
    }

    @keyframes lds-dual-ring {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- The WASM code will resize the canvas dynamically -->
  <!-- the id is hardcoded in main.rs . so, make sure both match. -->
  <canvas id="the_canvas_id"></canvas>

  <!-- the loading spinner will be removed in main.rs -->
  <div class="centered" id="loading_text">
    <noscript>You need javascript to use this website</noscript>
    <div class="brand">InfraTrace</div>
    <p class="loading-title">Поиск инфраструктуры по ИНН</p>
    <p class="loading-copy">Загружаем интерфейс поиска и визуализации инфраструктуры компании.</p>
    <div class="lds-dual-ring"></div>
  </div>

  <!--Register Service Worker. this will cache the wasm / js scripts for offline use (for PWA functionality). -->
  <!-- Force refresh (Ctrl + F5) to load the latest files instead of cached files  -->
  <script>
    // We disable caching during development so that we always view the latest version.
    if ('serviceWorker' in navigator && window.location.hash !== "#dev") {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>

</html>
