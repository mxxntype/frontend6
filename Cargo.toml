[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = "warn"
suspicious = "warn"
style = "warn"
pedantic = "warn"
nursery = "warn"
complexity = "warn"
perf = "warn"
enum_glob_use = { level = "warn", priority = 1 }
single_match_else = { level = "allow", priority = 1 }
match_bool = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }

[workspace.dependencies]
axum = "0.8.9"
clap = "4.6.1"
color-eyre = "0.6.5"
eframe = "0.34.3"
egui = "0.34.3"
f6-types = { version = "0.1.0", path = "crates/f6-types" }
hickory-resolver = "0.26.1"
icann-rdap-client = "0.0.29"
icann-rdap-common = "0.0.29"
nutype = "0.7.0"
reqwest = "0.13.4"
rstest = "0.26.1"
serde = "1.0.228"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = "1.52.3"
tokio-util = "0.7.18"
tower-http = "0.6.11"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.23"
